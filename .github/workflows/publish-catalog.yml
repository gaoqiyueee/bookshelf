name: Publish catalog
on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci
      
      # 1. 先整体构建，生成dist文件
      - name: Build project
        run: npm run build

      # 2. 进入sync目录，执行脚本，传入环境变量
      - name: Run sync
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: my-bookshelf
        run: |
          cd packages/sync
          node ./dist/sync.js --full

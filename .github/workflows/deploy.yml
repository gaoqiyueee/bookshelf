name: Build & Sync & Deploy Bookshelf

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install system deps (cwebp + pdftoppm)
        run: |
          sudo apt update
          sudo apt install -y webp poppler-utils

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Ensure books directory exists
        run: mkdir -p books

      - name: Run sync (first time only --create)
        run: npm run sync -- --create

      - name: Deploy Cloudflare Worker
        run: npm run deploy
